name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    # Unit tests of the boot test's helper library (tests/lib/boot-test-lib.sh,
    # decision 0004): bats under kcov through tests/coverage.sh. Threshold is
    # the number measured in COVERAGE.md (100 percent, 97 of 97 lines,
    # 2026-09-26) and is only ever raised (decision 0006). This job produces
    # the check "tests / coverage", the required status on master.
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 100
  appliance:
    # The build and boot test (org-plan section 1): bt-layer, keel verify,
    # tests/boot-test.sh on the self-hosted LXC runner. test-appliance.yml
    # targets the labels "self-hosted, keel-lxc"; a job aimed at a label no
    # runner carries stays queued until GitHub cancels it after 24 hours, so
    # the reusable workflow's contract is that callers gate on the
    # organization variable KEEL_LXC_RUNNER (docs/ci-cd.md section 5 of the
    # keel repository). While it is "false" (no runner registered) this job
    # is skipped and produces no check. Once the maintainer sets it to "true"
    # the check "appliance / build-and-boot" appears and is added to the
    # protection rule of master (the job id is part of that check name).
    if: vars.KEEL_LXC_RUNNER == 'true'
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@main
    with:
      appliance: core
