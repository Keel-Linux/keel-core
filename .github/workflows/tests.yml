name: tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  tests:
    # Unit tests of the boot test's helper library (tests/lib/boot-test-lib.sh,
    # decision 0004): bats under kcov through tests/coverage.sh. Threshold is
    # the number measured in COVERAGE.md (100 percent, 97 of 97 lines,
    # 2026-09-26) and is only ever raised (decision 0006). This job produces
    # the check "tests / coverage", the required status on master.
    uses: keel-linux/.github/.github/workflows/test-shell.yml@main
    with:
      threshold: 100
  appliance:
    # The boot test (org-plan section 1): the core layer is fetched from
    # https://mirror.keellinux.org/layers, verified, assembled into a scratch
    # rootfs, booted in LXC and checked by tests/boot-test.sh, on the
    # self-hosted runner. Nothing is built there; the build host publishes
    # the layer (docs/releases-host.md of the keel repository).
    #
    # test-appliance.yml targets the labels "self-hosted, keel-lxc"; a job
    # aimed at a label no runner carries stays queued until GitHub cancels it
    # after 24 hours, so the reusable workflow's contract is that callers gate
    # on the organization variable KEEL_LXC_RUNNER (docs/ci-cd.md section 5 of
    # the keel repository). While it is "false" this job is skipped and
    # produces no check. With it "true" the check
    # "appliance / build-and-boot" appears and is required on master (the job
    # id is part of that check name).
    if: vars.KEEL_LXC_RUNNER == 'true'
    uses: keel-linux/.github/.github/workflows/test-appliance.yml@verify/gate-behaviour
    with:
      appliance: core
      allow_unpublished: true
      # core is the rootfs layer at the bottom of every chain.
      parent: ""
      timeout: 60
