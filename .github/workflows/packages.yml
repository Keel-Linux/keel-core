# The keel-core package of packages/keel-core (handbook decision 0041,
# first implementation, step 4). The check is "packages / build".
#
# The package is built, source and binary, with dpkg-buildpackage and
# linted with lintian, any error or warning failing, on trixie, the
# release it is for; then tests/package.bats builds it again and reads back
# its fields, its files and the manifest. Nothing is signed or published:
# publishing is the maintainer's attended release (Keel-Linux/apt,
# docs/build-host.md). What the package does on a machine, the manifest
# validating and keel converging the overlays from it, is proven on the
# built image (tests/README.md, "The package on a built image").
name: packages

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 15
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates git build-essential debhelper lintian bats \
            python3-yaml
      - uses: actions/checkout@v4
      - name: Build and lint keel-core
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp -a packages/keel-core "$work/src"
          (cd "$work/src" && dpkg-buildpackage -us -uc)
          lintian --fail-on error,warning --info --display-info \
            "$work"/keel-core_*.changes
          mkdir -p dist
          cp "$work"/*.deb "$work"/*.dsc "$work"/*.tar.* "$work"/*.changes dist/
      - name: The package and its manifest
        run: |
          set -o pipefail
          bats tests/package.bats 2>&1 | tee package.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keel-core-deb
          path: dist/
          if-no-files-found: error
