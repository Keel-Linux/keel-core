# Installed by keel-core as /usr/lib/systemd/system/monit.service.d/.
# Monit's checks of Keel Core are the units of the manifest's processes
# (manifest.yaml, beside debian/). Started beside them, monit's first
# cycle after a boot found webmin and postfix inactive (keel#61), so
# monit starts after them. Ordering only: a unit that fails does not
# keep monit from starting, and monit then reports it.
[Unit]
After=ssh.service webmin.service postfix.service
